name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      name: ${{ steps.info.outputs.name }}
      sdk: ${{ steps.info.outputs.sdk }}
      build_tools: ${{ steps.info.outputs.build_tools }}
      ndk: ${{ steps.info.outputs.ndk }}
      rust: ${{ steps.info.outputs.rust }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and toolchain info
        id: info
        run: |
          gradle_file=app/build.gradle.kts
          version=$(sed -n 's/^val appVersion = "\([^"]*\)".*/\1/p' "$gradle_file")
          suffix=$(sed -n 's/^val betaSuffix = "\([^"]*\)".*/\1/p' "$gradle_file")
          code=$(sed -n 's/^val defaultVersionCode = \([0-9]*\).*/\1/p' "$gradle_file")
          sdk_major=$(sed -n 's/^ *compileSdk = \([0-9]*\).*/\1/p' "$gradle_file")
          sdk_minor=$(sed -n 's/^ *compileSdkMinor = \([0-9]*\).*/\1/p' "$gradle_file")
          sdk="${sdk_major}.${sdk_minor:-0}"
          build_tools=$(sed -n 's/^ *buildToolsVersion = "\([^"]*\)".*/\1/p' "$gradle_file")
          ndk=$(sed -n 's/^ *ndkVersion = "\([^"]*\)".*/\1/p' "$gradle_file")
          rust=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' domain/libthreema/rust-toolchain.toml)
          for v in version code sdk_major build_tools ndk rust; do
            if [ -z "${!v}" ]; then echo "Could not determine $v" >&2; exit 1; fi
          done
          {
            echo "tag=v${version}${suffix}-${code}"
            echo "name=${version}${suffix}-${code}"
            echo "sdk=$sdk"
            echo "build_tools=$build_tools"
            echo "ndk=$ndk"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether this release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.info.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.info.outputs.tag }} already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The release is created empty first; every flavor job then attaches its
      # own APKs as soon as it finishes building.
      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Automated build of all flavors. APKs are added as each flavor finishes building.

          File names look like `Threema-<version>-<flavor>-<architecture>.apk`. Pick one flavor and one architecture.

          ## Flavor

          | Flavor | What it is |
          |--------|------------|
          | `libre` | No proprietary code (F-Droid style). No Google or Huawei services, no self-updater, uses your system emoji. |
          | `store-threema` | Threema Shop version, with proprietary push services and a self-updater. |
          | `store-google` | Google Play Store version. |
          | `hms` | Huawei AppGallery version. |
          | `store-google-work`, `hms-work`, `onprem` | Threema Work / OnPrem versions. Only useful if your company uses Threema Work or runs an OnPrem server. |

          ## Architecture

          | Architecture | Use it on |
          |--------------|-----------|
          | `arm64-v8a` | Almost every phone from the last several years. This is the one to pick if unsure. |
          | `armeabi-v7a` | Older 32-bit phones. |
          | `x86`, `x86_64` | Emulators and some Chromebooks or tablets. |
          | `universal` | Works everywhere, but is about twice as big. |

          ## Signing

          If the repository has signing secrets, the APKs are signed with that key. Otherwise each build is signed with a one-off key, so updating over an older build needs an uninstall first (back up your data).
          EOF
          sed -i 's/^          //' notes.md
          gh release create "${{ steps.info.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Threema ${{ steps.info.outputs.name }}" \
            --notes-file notes.md

  build:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # `suffix` is appended to every APK file name.
          - suffix: store-google
            task: assembleStore_googleRelease
            dir: store_google
          - suffix: store-google-work
            task: assembleStore_google_workRelease
            dir: store_google_work
          - suffix: store-threema
            task: assembleStore_threemaRelease
            dir: store_threema
          - suffix: libre
            task: assembleLibreRelease
            dir: libre
          - suffix: hms
            task: assembleHmsRelease
            dir: hms
          - suffix: hms-work
            task: assembleHms_workRelease
            dir: hms_work
          - suffix: onprem
            task: assembleOnpremRelease
            dir: onprem
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "sdkmanager not found under $sdk_root" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install \
            "platforms;android-${{ needs.prepare.outputs.sdk }}" \
            "build-tools;${{ needs.prepare.outputs.build_tools }}" \
            "ndk;${{ needs.prepare.outputs.ndk }}"

      - name: Install protobuf compiler
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler

      - name: Set up Rust
        run: |
          rustup toolchain install "${{ needs.prepare.outputs.rust }}" --profile minimal
          rustup default "${{ needs.prepare.outputs.rust }}"
          rustup target add \
            armv7-linux-androideabi aarch64-linux-android \
            i686-linux-android x86_64-linux-android

      # Optional: sign with your own keystore. Without these secrets the build
      # falls back to a locally generated keystore, which changes on every run,
      # so updates over a previous release will not install.
      # Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # The same key is used for every flavor.
      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret set, APK will be signed with a throwaway keystore."
            exit 0
          fi
          # The build looks for ../../keystore relative to the app directory,
          # i.e. a `keystore` directory next to the repository checkout.
          dir="$GITHUB_WORKSPACE/../keystore"
          mkdir -p "$dir"
          for name in threema threema_hms onprem; do
            echo "$KEYSTORE_BASE64" | base64 -d > "$dir/$name.keystore"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$dir/$name.properties"
          done

      - name: Build APKs
        run: ./gradlew --no-daemon -PbuildUniversalApk ${{ matrix.task }}

      # Gradle only signs the APKs when a keystore was set up above. Otherwise
      # they come out as "*-unsigned.apk", which Android refuses to install, so
      # sign them here with a one-off key.
      - name: Sign APKs if needed
        run: |
          out=app/build/outputs/apk/${{ matrix.dir }}/release
          if ! ls "$out"/*-unsigned.apk >/dev/null 2>&1; then
            echo "APKs are already signed."
            exit 0
          fi
          echo "::warning::APKs were unsigned, signing with a one-off key. Set the KEYSTORE_* secrets for a stable key."
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$sdk_root/build-tools/${{ needs.prepare.outputs.build_tools }}/apksigner"
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/oneoff.jks" -alias oneoff \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$pass" -keypass "$pass" -dname "CN=Unofficial Threema build"
          for f in "$out"/*-unsigned.apk; do
            "$apksigner" sign --ks "$RUNNER_TEMP/oneoff.jks" --ks-key-alias oneoff \
              --ks-pass "pass:$pass" --key-pass "pass:$pass" \
              --out "${f%-unsigned.apk}.apk" "$f"
            rm -f "$f" "${f%-unsigned.apk}.apk.idsig"
          done
          ls -l "$out"

      # Final file name: Threema-<version>-<flavor>-<architecture>.apk
      - name: Rename APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/${{ matrix.dir }}/release/*.apk; do
            base=$(basename "$f" .apk)
            arch=${base#app-${{ matrix.dir }}-}
            arch=${arch%-release*}
            cp "$f" "dist/Threema-${{ needs.prepare.outputs.name }}-${{ matrix.suffix }}-${arch}.apk"
          done
          ls -l dist

      - name: Add APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
